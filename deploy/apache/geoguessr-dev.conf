<VirtualHost *:80>
    ServerName dev.geoguessr.spb.ru

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://dev.geoguessr.spb.ru%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/geoguessr-dev-error.log
    CustomLog ${APACHE_LOG_DIR}/geoguessr-dev-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName dev.geoguessr.spb.ru
        Protocols h2 http/1.1

        SSLEngine on
        Include /etc/letsencrypt/options-ssl-apache.conf
        SSLCertificateFile /etc/letsencrypt/live/dev.geoguessr.spb.ru/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/dev.geoguessr.spb.ru/privkey.pem

        ProxyRequests Off
        ProxyPreserveHost On
        ProxyTimeout 65
        ProxyPass / http://127.0.0.1:8000/ connectiontimeout=5 timeout=65
        ProxyPassReverse / http://127.0.0.1:8000/

        <Location "/">
            AuthType Basic
            AuthName "GeoGuessr SPb dev"
            AuthBasicProvider file
            AuthUserFile /etc/apache2/geoguessr-dev.htpasswd
            Require valid-user
        </Location>

        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"

        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set X-Robots-Tag "noindex, nofollow, noarchive"

        ErrorLog ${APACHE_LOG_DIR}/geoguessr-dev-error.log
        CustomLog ${APACHE_LOG_DIR}/geoguessr-dev-access.log combined
    </VirtualHost>
</IfModule>
